[package]
name = "fab"
version = "0.1.0"
edition = "2024"
default-run = "fab"

[dependencies]
anyhow = "1.0.104"
cgmath = "0.18.0"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dateparser = "0.3.1"
directories = "6.0.0"
js-sys = "=0.3.85"
monstertruck = { version = "0.4.1", features = ["full"] }
toml_edit = "0.25.17"

[package.metadata.docs.rs]
cargo_args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[lints.rustdoc]
private_doc_tests = "warn"
missing_docs = "deny"
missing_doc_code_examples = "warn"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
