[package]
name = "fab"
version = "0.1.0"
edition = "2024"
default-run = "fab"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dateparser = "0.3.1"
directories = "6.0.0"
js-sys = "=0.3.85"
monstertruck = { version = "0.4.1", features = ["full"] }
toml_edit = "0.25.17"

[[bin]]
name = "desi"
path = "designs/desi.rs"

[[bin]]
name = "dd"
path = "designs/dd.rs"

[[bin]]
name = "test"
path = "designs/test.rs"
yo = "hey"
